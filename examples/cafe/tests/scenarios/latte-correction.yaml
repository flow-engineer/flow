# A spec: one situation to put the agent in, and what has to be true at the end.
id: latte-correction
title: Milk corrected to oat   # a short name, at most 45 characters
about: Orders a large latte, corrects the milk mid-thought, then confirms.   # what it tests
theme: Ordering                # the area of the agent it tests
channels: [whatsapp]         # each platform it runs on, with that simulator's rules

person:                      # played by a model that sees only what a person would see
  persona: Sam, in a hurry on the way to work; types in short bursts, no capitals.
  goal: Get a large oat latte for pickup, under the name Sam.
  knows:                     # told only if the agent asks
    - Their name is Sam.

opening:                     # the first messages, sent exactly like this; then the person plays on
  - say: "can i get a large latte"
  - say: "oat milk actually"
    after_ms: 1200

world: |                     # what is true in this test, in words: for the person, the judge, and a model playing a tool
  The menu is as in tests/tools/get_menu.yaml. Oat milk is in stock. The café is busy this
  morning, so the point of sale is slow to take orders, but they go through.

given:                       # the same world as data: each tool call is played by rule from it, a model only last
  menu: get_menu.yaml        # a tool file's name: that tool's usual output (the fakes read it)
  stock: { oat: true }       # any other value: plain data for the fakes (tests/tools/*.fake.ts)
  tools:
    place_order: slow        # usual | slow | down | flaky N%: slow, as long as its slowest response with an output

max_turns: 8

expect:
  state:                     # checked in code against what the fakes kept: exactly one order, as below
    orders:
      - name: Sam
        items: [{ item: Latte, size: large, milk: oat, quantity: 1 }]
  judge:                    # read by the judge from the transcript, each pass or fail with a reason
    - The order read back to Sam uses oat milk, not whole milk.
    - The agent asks Sam to confirm before placing the order.
    - Sam is told the order number and when it will be ready.
    - Prices match the menu.
