id: vague-answer
title: Vague answer
about: A vague date ("a while back") says nothing; the agent asks again and takes the clear answer.
theme: Collecting
channels: [whatsapp]
person:
  persona: Priya, vague at first, clear when pressed gently.
  goal: List a sofa. You are done once you have said yes to a summary.
  knows:
    - A sofa, good condition, 200, postcode L1 8JQ, collect Sundays.
    - When asked when it was bought, first says "a while back", then when asked again says about 4 years ago.
    - No faults.
opening:
  - say: "selling my sofa, good condition, 200, L1 8JQ, sundays"
tools: { real: [update_listing, publish_listing] }
world: Nothing special. The listing tools work.
max_turns: 12
expect:
  calls:
    - { tool: publish_listing }
  judge:
    - The summary Priya says yes to lists a sofa bought about four years ago (around {{now - 1460d | date}}).
    - The summary shows a purchase time of about four years ago, not "a while back".
    - Every message from the agent holds at most one question.
    - The agent never asks for something the person has already told it in this conversation.
    - Each turn of the agent is a single message to the person, not several in a row.
